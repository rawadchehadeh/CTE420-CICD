name: C++ CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Build the program
        run: g++ -std=c++17 -Wall -Wextra main.cpp -o calculator
      - name: Test the program
        run: test "$(./calculator)" = "5"
